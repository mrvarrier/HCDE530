services:
  - type: web
    name: ux-auditor
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_PAGESPEED_API_KEY
        sync: false
      - key: VITE_ENABLE_SCRAPING
        value: true
      - key: VITE_BACKEND_URL
        value: https://ux-auditor.onrender.com/api
